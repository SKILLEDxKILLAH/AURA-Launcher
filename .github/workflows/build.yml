name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Render UI screenshots
        run: ./gradlew :app:testDebugUnitTest --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@v4
        with:
          name: aura-launcher-apks
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aura-screenshots
          path: app/build/screenshots/*.png
